<div class="form-field w-100" [class]="inputQuestion.inputClass">
  <div class="form-group">
    @if(inputQuestion.label){
      <label class="main-label d-block lh-1 text-black" [for]="inputQuestion.key">
        {{inputQuestion.label}}
      </label>
    }
    <div
      class="checkbox"
    >
      <file-upload
        [id]="inputQuestion.key"
        [formControl]="formControl"
        [matTooltip]="inputQuestion.inputTooltip || ''"
        [class.error]="formControl.errors && (formControl.touched || formControl.dirty)"
        [multiple]="inputQuestion.multiple"
        class="file-uploader"
      ></file-upload>
    </div>
    <div class="error-wrapper">
      @if (formControl.errors && (formControl.touched || formControl.dirty)) {
        <mat-error>
          {{ formControl.errors | formError}}
        </mat-error>
      }
    </div>
  </div>
</div>
