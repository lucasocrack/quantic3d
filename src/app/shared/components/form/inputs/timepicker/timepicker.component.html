<div class="form-field w-100" [class]="inputQuestion.inputClass">
  <div class="form-group">
    @if(inputQuestion.label){
      <label class="main-label d-block lh-1 text-black" [for]="inputQuestion.key">
        {{inputQuestion.label}}
      </label>
    }
    <mat-form-field
      class="mat-form"
      [class.start]="inputQuestion.startIcon"
    >
      @if(inputQuestion.placeholder){
        <mat-label>
          {{ inputQuestion.placeholder }}
        </mat-label>
      }
      @if(inputQuestion.startIcon) {
        <div
          class="icon-start"
          [matTooltip]="inputQuestion.startIcon.tooltip || ''"
          [style.color]="inputQuestion.startIcon.color || 'var(--blackColor)'"
        >
          <i class="material-symbols-outlined">
            {{inputQuestion.startIcon.icon}}
          </i>
        </div>
      }
      <input
        matInput
        [ngxTimepicker]="picker"
        [id]="inputQuestion.key"
        [formControl]="formControl"
        [errorStateMatcher]="matcher"
        [matTooltip]="inputQuestion.inputTooltip || ''"
        [class.error]="formControl.errors && (formControl.touched || formControl.dirty)"
        [format]="inputQuestion.format || 24"
      >
      <ngx-material-timepicker #picker></ngx-material-timepicker>
      <div
        class="icon-end"
      >
        <i class="material-symbols-outlined">
          schedule
        </i>
      </div>
    </mat-form-field>
    <div class="error-wrapper">
      @if (formControl.errors && (formControl.touched || formControl.dirty)) {
        <mat-error>
          {{ formControl.errors | formError}}
        </mat-error>
      }
    </div>
  </div>
</div>
