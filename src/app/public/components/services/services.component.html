<div class="services container-lg" [class.component-dark-theme]="customizerSettingsService.isDark()">
  <h2>Nossos Serviços</h2>
  <ul>
    <li *ngFor="let service of services">
      <mat-icon>{{ service.icon }}</mat-icon>
      <h3>{{ service.title }}</h3>
      <p>{{ service.description }}</p>
    </li>
  </ul>
</div>
