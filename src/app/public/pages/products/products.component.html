<section id="products" class="container">
  <!-- Products Grid -->
  <h2 class="text-center text-danger">Pagina em construção</h2>
  <div
    class="row"
    [class.component-dark-theme]="themeService.isDark()"
    [class.rtl-enabled]="themeService.isRTLEnabled()"
  >
    <div class="col-md-4 col-lg-3">

      <!-- Filter Sidebar Card -->
      <mat-card class="daxa-card filter-sidebar-card mb-25 border-radius bg-white border-none d-block">
        <mat-card-header>
          <mat-card-title>
            <h5 class="mb-0">
              Filtros
            </h5>
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="filter-item">
            <form class="search-box position-relative">
              <i class="material-symbols-outlined">
                search
              </i>
              <input type="text" class="input-search d-block w-100 border-none outline-0" placeholder="Search product...">
            </form>
          </div>
          <div class="filter-item">
            <span class="d-block fw-medium">
              Categorias
            </span>
            <ul class="filters-list pl-0 mb-0 list-unstyled">
              <li class="d-flex align-items-center justify-content-between">
                <mat-checkbox>
                  Todos
                </mat-checkbox>
                <span class="number d-block text-body">
                  ***
                </span>
              </li>
              <li class="d-flex align-items-center justify-content-between">
                <mat-checkbox>
                  Prototipagem
                </mat-checkbox>
                <span class="number d-block text-body">
                  ***
                </span>
              </li>
              <li class="d-flex align-items-center justify-content-between">
                <mat-checkbox>
                  Impressão 3D
                </mat-checkbox>
                <span class="number d-block text-body">
                  ***
                </span>
              </li>
            </ul>
          </div>
        </mat-card-content>
      </mat-card>

    </div>
    <div class="col-md-8 col-lg-9">

      <!-- Products -->
      <div class="row">
        <div class="col-sm-6 col-lg-4" *ngFor="let product of products">
          <mat-card class="daxa-card product-card text-center mb-25 border-radius p-0 bg-white border-none d-block">
            <mat-card-content>
              <div class="image position-relative border-radius">
                <a [routerLink]="product.link" class="d-block border-radius">
                  <img [src]="product.image" class="border-radius transition" alt="product-image">
                </a>
                <button mat-fab>
                  <i class="ri-heart-line"></i>
                </button>
              </div>
              <div class="content">
                <h5>
                  <a [routerLink]="product.link">
                    {{ product.name }}
                  </a>
                </h5>
                <button mat-button>
                  Ver Detalhes
                </button>
              </div>
            </mat-card-content>
          </mat-card>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination-card mb-25 d-lg-flex align-items-center justify-content-between">
        <p class="mb-0">
          Showing 1 to 9 of 50 entries
        </p>
        <ol class="pagination list-unstyled mt-0 mb-0 pl-0">
          <li class="pagination-item d-inline-block">
            <a mat-button routerLink="/ecommerce-page">
              <i class="material-symbols-outlined">
                west
              </i>
            </a>
          </li>
          <li class="pagination-item d-inline-block">
            <a mat-button routerLink="/ecommerce-page" class="active">
              1
            </a>
          </li>
          <li class="pagination-item d-inline-block">
            <a mat-button routerLink="/ecommerce-page">
              2
            </a>
          </li>
          <li class="pagination-item d-inline-block">
            <a mat-button routerLink="/ecommerce-page">
              3
            </a>
          </li>
          <li class="pagination-item d-inline-block">
            <a mat-button routerLink="/ecommerce-page">
              <i class="material-symbols-outlined">
                east
              </i>
            </a>
          </li>
        </ol>
      </div>

    </div>
  </div>
</section>
