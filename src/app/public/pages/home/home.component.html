<section id="home" [class.component-dark-theme]="customizerSettingsService.isDark()" [class.hide-sidebar]="customizerSettingsService.isHideSidebar()">

    <div class="row">

        <div class="text">
          <h3 class="mb-0">Bem vindo a</h3>

          <p class="maintenance-message">Nosso site está em atualização.</p>

      </div>
      <div class="display_home col-12 col-sm-6 text-right">
